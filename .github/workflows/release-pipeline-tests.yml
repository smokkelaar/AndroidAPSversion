name: Release Pipeline Tests

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Install test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Planner and workflow isolation regression tests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Test APK alignment, signing and verification with disposable keys
        run: python .github/scripts/signing_smoke.py
