name: Build Upstream Release
'on':
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      channel:
        required: true
        type: string
      release_tag:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    name: ${{ inputs.channel }} / ${{ inputs.source_ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
    - uses: actions/checkout@v5
      with:
        path: controller
        persist-credentials: false
    - uses: actions/checkout@v5
      with:
        repository: nightscout/AndroidAPS
        ref: ${{ inputs.source_sha }}
        path: source
        fetch-depth: 1
        persist-credentials: false
    - name: Read upstream version and JVM requirement
      run: |
        set -euo pipefail
        VERSION=$(sed -n 's/.*const val appVersion = "\([^"]*\)".*/\1/p' buildSrc/src/main/kotlin/Versions.kt)
        test -n "$VERSION"
        JAVA_VERSION=$(jq -r '.default' ../controller/.github/jdk-map.json)
        while IFS=$'\t' read -r pattern jdk; do
          if [[ "$VERSION" == $pattern ]]; then JAVA_VERSION="$jdk"; break; fi
        done < <(jq -r '.mappings[] | "\(.pattern)\t\(.jdk)"' ../controller/.github/jdk-map.json)
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "JAVA_VERSION=$JAVA_VERSION" >> "$GITHUB_ENV"
    - uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: temurin
        cache: gradle
        cache-dependency-path: source/**/*.gradle*
    - name: Build APKs without private signing credentials
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleFullRelease :wear:assembleFullRelease \
          -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseParallelGC -Xss4m" \
          -Dkotlin.daemon.jvm.options="-Xmx1g" \
          -Pkotlin.compiler.execution.strategy="in-process" -Dorg.gradle.workers.max=2
    - name: Collect phone and Wear APK data
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/apk-data"
        for module in app wear; do
          APK_FILES=("$module/build/outputs/apk/full/release/"*.apk)
          test "${#APK_FILES[@]}" -eq 1 && test -f "${APK_FILES[0]}"
          NAME=phone
          if [ "$module" = wear ]; then NAME=wear; fi
          cp -- "${APK_FILES[0]}" "$RUNNER_TEMP/apk-data/${NAME}.apk"
        done
    - name: Transfer APK data to isolated signing runner
      uses: actions/upload-artifact@v4
      with:
        name: apk-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.release_tag
          }}
        path: ${{ runner.temp }}/apk-data/*.apk
        if-no-files-found: error
        retention-days: 2
    permissions:
      contents: read
  publish:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/sign-publish-apks.yml
    with:
      artifact_name: apk-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.release_tag
        }}
      release_tag: ${{ inputs.release_tag }}
      release_title: AAPS ${{ inputs.channel }} / ${{ inputs.source_ref }}
      source_ref: ${{ inputs.source_ref }}
      source_sha: ${{ inputs.source_sha }}
      prerelease: ${{ inputs.channel != 'tags' || contains(inputs.source_ref, '-')
        }}
    secrets: inherit
