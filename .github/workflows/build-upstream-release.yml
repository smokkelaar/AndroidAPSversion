name: Build Upstream Release
'on':
  workflow_call:
    inputs:
      source_repository:
        required: false
        default: nightscout/AndroidAPS
        type: string
      source_sha:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      channel:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      android_note:
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  build:
    name: ${{ inputs.channel }} / ${{ inputs.source_ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
    - uses: actions/checkout@v5
      with:
        path: controller
        persist-credentials: false
    - uses: actions/checkout@v5
      with:
        repository: ${{ inputs.source_repository }}
        ref: ${{ inputs.source_sha }}
        path: source
        fetch-depth: 1
        persist-credentials: false
    - name: Read upstream version and JVM requirement
      id: metadata
      run: python3 ../controller/.github/scripts/build_metadata.py
    - uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: temurin
        cache: gradle
        cache-dependency-path: source/**/*.gradle*
    - name: Install historical Android SDK packages when needed
      if: env.COMPILE_SDK == '28'
      # Modern SDK tools need a newer JVM than the historical Gradle build.
      run: |
        PACKAGES=("platforms;android-28" "build-tools;29.0.2")
        if [ "$VERSION" = '2.8.2.1' ]; then
          PACKAGES+=("ndk;21.1.6352462")
        elif [ "$VERSION" = '2.6.2' ]; then
          PACKAGES+=("ndk;20.0.5594570")
        fi
        JAVA_HOME="$JAVA_HOME_17_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "${PACKAGES[@]}"
        if [ "$VERSION" = '2.6.2' ]; then
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/20.0.5594570" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/20.0.5594570" >> "$GITHUB_ENV"
        fi
    - name: Build APKs without private signing credentials
      run: |
        chmod +x gradlew
        EXTRA_ARGS=()
        if [ "$VERSION" = '2.6.2' ] || [ "$VERSION" = '2.8.2.1' ]; then
          python3 ../controller/.github/scripts/restore_legacy.py
          # GITHUB_ENV becomes available to later steps; expose it in this step too.
          export LEGACY_MAVEN="$RUNNER_TEMP/legacy-maven"
          EXTRA_ARGS=(-I ../controller/.github/legacy-build/init.gradle)
        fi
        ./gradlew :app:assembleFullRelease :wear:assembleFullRelease \
          "${EXTRA_ARGS[@]}" \
          -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseParallelGC -Xss4m" \
          -Dkotlin.daemon.jvm.options="-Xmx1g" \
          -Pkotlin.compiler.execution.strategy="in-process" -Dorg.gradle.workers.max=2
    - name: Collect phone and Wear APK data
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/apk-data"
        for module in app wear; do
          APK_FILES=("$module/build/outputs/apk/full/release/"*.apk)
          test "${#APK_FILES[@]}" -eq 1 && test -f "${APK_FILES[0]}"
          NAME=phone
          if [ "$module" = wear ]; then NAME=wear; fi
          cp -- "${APK_FILES[0]}" "$RUNNER_TEMP/apk-data/${NAME}.apk"
        done
    - name: Transfer APK data to isolated signing runner
      uses: actions/upload-artifact@v4
      with:
        name: apk-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.release_tag
          }}
        path: ${{ runner.temp }}/apk-data/*.apk
        if-no-files-found: error
        retention-days: 2
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      min_sdk: ${{ steps.metadata.outputs.min_sdk }}
  publish:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/sign-publish-apks.yml
    with:
      artifact_name: apk-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.release_tag
        }}
      release_tag: ${{ inputs.release_tag }}
      release_title: ${{ contains(fromJSON('["master", "dev", "dev3"]'), inputs.channel) && format('AAPS {0} – nieuwste build ({1})', inputs.channel, needs.build.outputs.version) || format('AAPS {0}', needs.build.outputs.version) }}
      source_ref: ${{ inputs.source_ref }}
      source_sha: ${{ inputs.source_sha }}
      source_repository: ${{ inputs.source_repository }}
      min_phone_sdk: ${{ needs.build.outputs.min_sdk }}
      android_note: 'Minimum Android API ${{ needs.build.outputs.min_sdk }}. ${{ inputs.android_note }}'
      prerelease: ${{ (inputs.channel != 'tags' && inputs.channel != 'legacy') || contains(inputs.source_ref, '-')
        }}
    secrets: inherit
