name: Cherry Pick CI (Pre-release Feature Backport)
permissions:
  contents: read
jobs:
  build:
    name: Build AAPS
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        path: controller
        persist-credentials: false
    - name: Preserve trusted JVM map
      run: |
        cp controller/.github/jdk-map.json "$RUNNER_TEMP/jdk-map.json"
    - name: Checkout current branch
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Load jdk versions
      run: |
        JAVA_VERSION=$(jq -r '.default' "$RUNNER_TEMP/jdk-map.json")
        echo "JAVA_VERSION=$JAVA_VERSION" >> $GITHUB_ENV
    - name: Fetch upstream and verify commits
      run: |
        [[ "$INPUT_UPSTREAM_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
        [[ "$INPUT_CHERRY_PICK" =~ ^[a-fA-F0-9]{7,40}(\ [a-fA-F0-9]{7,40})*$ ]]
        git remote add upstream "https://github.com/${INPUT_UPSTREAM_REPO}.git"
        git fetch upstream
        echo "✅ Upstream branches fetched."

        ALL_FOUND=true
        for HASH in ${INPUT_CHERRY_PICK}; do
          TYPE=$(git cat-file -t "$HASH" 2>/dev/null || true)
          if [ "$TYPE" = "commit" ]; then
            echo "✅ $HASH is reachable from a branch"
            continue
          fi

          # Commit not on any branch — may be from a squash-merged PR.
          # Use the GitHub API to find which PR contains this commit, then
          # fetch that PR's preserved ref (refs/pull/<n>/head).
          echo "ℹ️ $HASH not on any branch — looking up PR via GitHub API..."
          PR_NUMBER=$(curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${INPUT_UPSTREAM_REPO}/commits/$HASH/pulls" \
            | jq -r '.[0].number // empty')

          if [ -n "$PR_NUMBER" ]; then
            echo "🔗 Found in PR #$PR_NUMBER — fetching PR ref..."
            git fetch upstream "refs/pull/$PR_NUMBER/head:refs/remotes/upstream/pr/$PR_NUMBER"
            TYPE2=$(git cat-file -t "$HASH" 2>/dev/null || true)
            if [ "$TYPE2" = "commit" ]; then
              echo "✅ $HASH now available via PR #$PR_NUMBER"
            else
              echo "❌ $HASH still not found after fetching PR #$PR_NUMBER"
              ALL_FOUND=false
            fi
          else
            echo "❌ $HASH is not reachable from any branch or PR in upstream."
            echo "   Possible cause: squash-merged and PR ref no longer preserved."
            echo "   Tip: use the merge commit SHA that landed on the target branch instead."
            ALL_FOUND=false
          fi
        done

        if [ "$ALL_FOUND" = "false" ]; then
          echo "🛑 One or more commits could not be resolved. Aborting."
          exit 1
        fi
        echo "✅ All commits verified and reachable."
      env:
        INPUT_CHERRY_PICK: ${{ inputs.cherry_pick }}
        INPUT_UPSTREAM_REPO: ${{ inputs.upstream_repo }}
    - name: Cherry-pick commits
      run: |
        echo "➡️ Cherry-picking commits: ${INPUT_CHERRY_PICK}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        if ! git cherry-pick ${INPUT_CHERRY_PICK}; then
          echo "❌ Cherry-pick failed. Exiting."
          exit 1
        fi

        echo "✅ All commits cherry-picked."
      env:
        INPUT_CHERRY_PICK: ${{ inputs.cherry_pick }}
    - name: Set BUILD_VARIANT
      run: |
        BUILD_VARIANT="${INPUT_BUILDVARIANT}"
        echo "BUILD_VARIANT=$BUILD_VARIANT" >> $GITHUB_ENV
        VARIANT_FLAVOR=$(echo "$BUILD_VARIANT" | sed -E 's/(Release|Debug)$//' | tr '[:upper:]' '[:lower:]')
        VARIANT_TYPE=$(echo "$BUILD_VARIANT" | grep -oE '(Release|Debug)$' | tr '[:upper:]' '[:lower:]')
        echo "VARIANT_FLAVOR=$VARIANT_FLAVOR" >> $GITHUB_ENV
        echo "VARIANT_TYPE=$VARIANT_TYPE" >> $GITHUB_ENV
        VERSION_SUFFIX=""
        if [[ "$VARIANT_FLAVOR" != "full" ]]; then VERSION_SUFFIX="$VARIANT_FLAVOR"; fi
        if [[ "$VARIANT_TYPE" == "debug" ]]; then VERSION_SUFFIX="$VERSION_SUFFIX-debug"; fi
        if [[ -n "$VERSION_SUFFIX" && "$VERSION_SUFFIX" != -* ]]; then VERSION_SUFFIX="-$VERSION_SUFFIX"; fi
        echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> $GITHUB_ENV
      env:
        INPUT_BUILDVARIANT: ${{ inputs.buildVariant }}
    - name: Extract VERSION
      run: |
        BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
        if echo "$BRANCH_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
          VERSION="$BRANCH_NAME"
        else
          VERSION=$(grep 'val appVersion' buildSrc/src/main/kotlin/Versions.kt | awk -F '"' '{print $2}')
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: temurin
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build APKs
      run: |
        ./gradlew :app:assemble${{ env.BUILD_VARIANT }} :wear:assemble${{ env.BUILD_VARIANT }} \
          -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseParallelGC -Xss4m" \
          -Dkotlin.daemon.jvm.options="-Xmx2g" \
          -Dkotlin.compiler.execution.strategy="in-process" \
          -Dorg.gradle.daemon=true \
          -Dorg.gradle.workers.max=2 \
          -Dorg.gradle.caching=true
    - name: Record built source commit
      id: source
      run: |
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Collect phone and Wear APK data
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/apk-data"
        for module in app wear; do
          APK_FILES=("$module/build/outputs/apk/${VARIANT_FLAVOR}/${VARIANT_TYPE}/"*.apk)
          test "${#APK_FILES[@]}" -eq 1 && test -f "${APK_FILES[0]}"
          NAME=phone
          if [ "$module" = wear ]; then NAME=wear; fi
          cp -- "${APK_FILES[0]}" "$RUNNER_TEMP/apk-data/${NAME}.apk"
        done
    - name: Transfer APK data to isolated signing runner
      uses: actions/upload-artifact@v4
      with:
        name: apk-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/apk-data/*.apk
        if-no-files-found: error
        retention-days: 2
    permissions:
      contents: read
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
  publish:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/sign-publish-apks.yml
    secrets: inherit
    with:
      artifact_name: apk-${{ github.run_id }}-${{ github.run_attempt }}
      release_tag: manual-${{ github.run_id }}
      release_title: AAPS ${{ inputs.buildVariant }} / ${{ github.workflow }}
      source_ref: ${{ github.workflow }}
      source_sha: ${{ needs.build.outputs.source_sha }}
      prerelease: true
'on':
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repository (format: owner/repo)'
        required: true
        default: nightscout/AndroidAPS
      cherry_pick:
        description: Commit hash(es) to cherry-pick (e.g. abc123 def456)
        required: true
      buildVariant:
        description: Select Build Variant
        required: true
        default: fullRelease
        type: choice
        options:
        - fullRelease
        - fullDebug
        - aapsclientRelease
        - aapsclientDebug
        - aapsclient2Release
        - aapsclient2Debug
        - pumpcontrolRelease
        - pumpcontrolDebug
