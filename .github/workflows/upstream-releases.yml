name: Upstream Releases
permissions:
  contents: read
concurrency:
  group: upstream-releases
  cancel-in-progress: false
jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' || vars.UPSTREAM_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Discover new upstream tags and branch heads
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/plan_upstream.py
    permissions:
      contents: write
  build:
    needs: discover
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/build-upstream-release.yml
    with:
      source_sha: ${{ matrix.sha }}
      source_ref: ${{ matrix.ref }}
      channel: ${{ matrix.channel }}
      release_tag: ${{ matrix.release_tag }}
    secrets: inherit
    permissions:
      contents: write
  cleanup:
    needs: [discover, build]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Remove replaced automatic branch releases and APKs
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/plan_upstream.py --cleanup
'on':
  schedule:
  - cron: 7 * * * *
  workflow_dispatch: null
