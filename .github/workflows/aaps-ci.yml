name: AAPS CI

on:
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Select AAPS Version (dev-c is a pinned development snapshot)'
        required: true
        default: '3.4.2.6'
        type: choice
        options:
          - 4.0.0-dev-c
          # ── 3.4.x (JDK 21) ──────────────────────────────
          - 3.4.2.6
          - 3.4.2.4
          - 3.4.2.3
          - 3.4.2.2
          - 3.4.2.1
          - 3.4.2.0
          - 3.4.1.0
          - 3.4.0.0
          # ── 3.3.x (JDK 21) ──────────────────────────────
          - 3.3.2.1
      buildVariant:
        description: 'Select Build Variant'
        required: true
        default: 'fullRelease'
        type: choice
        options:
          - fullRelease
          - fullDebug
          - aapsclientRelease
          - aapsclientDebug
          - aapsclient2Release
          - aapsclient2Debug
          - pumpcontrolRelease
          - pumpcontrolDebug

permissions:
  contents: write

jobs:
  build:
    name: Build AAPS
    runs-on: ubuntu-24.04
    steps:
      - name: Load signing secrets
        env:
          SECRET_KEYSTORE_SET: ${{ secrets.KEYSTORE_SET }}
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SECRET_KEYSTORE_SET" ]; then
            echo "🔐 Decoding KEYSTORE_SET..."
            DECODED=$(printf '%s' "$SECRET_KEYSTORE_SET" | base64 -d)

            KEYSTORE_BASE64=$(echo "$DECODED" | cut -d'|' -f1)
            KEYSTORE_PASSWORD=$(echo "$DECODED" | cut -d'|' -f2)
            KEY_ALIAS=$(echo "$DECODED" | cut -d'|' -f3)
            KEY_PASSWORD=$(echo "$DECODED" | cut -d'|' -f4)

            echo "KEYSTORE_BASE64=$KEYSTORE_BASE64" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV

            echo "::add-mask::$KEYSTORE_BASE64"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "::add-mask::$KEY_ALIAS"
            echo "::add-mask::$KEY_PASSWORD"

            echo "✅ Keystore parameters extracted from KEYSTORE_SET"
          else
            echo "ℹ️ KEYSTORE_SET not provided, using separate secrets."
            echo "KEYSTORE_BASE64=$SECRET_KEYSTORE_BASE64" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> $GITHUB_ENV
          fi

      - name: Check Secrets
        run: |
          echo "🔍 Checking required secrets..."
          MISSING=0

          check_secret() {
            if [ -z "$1" ]; then
              echo "❌ Missing secret: $2"
              MISSING=1
            fi
          }

          # Check secrets

          check_secret "$KEYSTORE_BASE64" "KEYSTORE_BASE64"
          check_secret "$KEYSTORE_PASSWORD" "KEYSTORE_PASSWORD"
          check_secret "$KEY_ALIAS" "KEY_ALIAS"
          check_secret "$KEY_PASSWORD" "KEY_PASSWORD"

          if [ "$MISSING" -eq 1 ]; then
            echo "🛑 Missing required secrets. Stopping build."
            exit 1
          fi

          echo "✅ All required secrets are present."

      - name: Decode keystore file
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/keystore.jks"

      - name: Validating keystore, alias and password
        run: |
          echo "🔐 Validating keystore, alias and password"

          # Create a dummy JAR file (quick method using zip)
          echo "test" > dummy.txt
          zip -q dummy.jar dummy.txt
          rm dummy.txt

          # Attempt to validate using jarsigner
          JARSIGNER_LOG=$(mktemp)
          if ! jarsigner \
              -keystore "$RUNNER_TEMP/keystore/keystore.jks" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              dummy.jar "$KEY_ALIAS" > "$JARSIGNER_LOG" 2>&1; then
            echo "❌ Either KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, or KEY_ALIAS is incorrect"
            echo "🔍 jarsigner error output:"
            cat "$JARSIGNER_LOG"
            rm -f "$JARSIGNER_LOG" dummy.jar
            exit 1
          fi
          rm -f "$JARSIGNER_LOG" dummy.jar
          echo "✅ Keystore, alias, and key password are valid."

          echo "✅ Keystore and credentials validated."

      - name: Check signing certificate matches existing APK
        run: |
          keytool -exportcert -keystore "$RUNNER_TEMP/keystore/keystore.jks" \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" \
            -file "$RUNNER_TEMP/keystore/certificate.der"
          EXPECTED="d6bf11fc569083e33dfc07733b579e4491beaa4ac3285b80fbe73e03c2691bb8"
          ACTUAL=$(sha256sum "$RUNNER_TEMP/keystore/certificate.der" | cut -d' ' -f1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Signing certificate differs from your existing 3.3.2.1 APK. Check KEY_ALIAS and KEYSTORE_BASE64."
            exit 1
          fi
          echo "Signing certificate matches your existing APK."

      - name: Checkout source code at tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch selected version from upstream
        env:
          SELECTED_VERSION: ${{ inputs.tagName }}
        run: |
          git remote add upstream https://github.com/nightscout/AndroidAPS.git
          if [ "$SELECTED_VERSION" = "4.0.0-dev-c" ]; then
            # Pin the requested dev-c snapshot rather than following a moving branch.
            SOURCE_REF="6deea754463b8df40251a765c4d12a289200cde3"
          else
            SOURCE_REF="refs/tags/$SELECTED_VERSION"
          fi
          git fetch upstream "$SOURCE_REF"
          SOURCE_COMMIT=$(git rev-parse 'FETCH_HEAD^{commit}')
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "Selected $SELECTED_VERSION at upstream commit $SOURCE_COMMIT"

      - name: Determine JVM version from tag
        run: |
          # jdk-map.json must be read before switching to the upstream tag,
          # as the upstream tag does not contain this file.
          TAG="${{ github.event.inputs.tagName }}"
          JAVA_VERSION=$(jq -r '.default' .github/jdk-map.json)
          while IFS=$'\t' read -r pattern jdk; do
            if [[ "$TAG" == $pattern ]]; then
              JAVA_VERSION="$jdk"
              break
            fi
          done < <(jq -r '.mappings[] | "\(.pattern)\t\(.jdk)"' .github/jdk-map.json)
          echo "JAVA_VERSION=$JAVA_VERSION" >> $GITHUB_ENV
          echo "ℹ️ Tag $TAG → JDK $JAVA_VERSION (from jdk-map.json)"

      - name: Switch to selected version
        env:
          SELECTED_VERSION: ${{ inputs.tagName }}
        run: |
          git checkout --detach "$SOURCE_COMMIT"
          ACTUAL_VERSION=$(sed -n 's/.*const val appVersion = "\([^"]*\)".*/\1/p' buildSrc/src/main/kotlin/Versions.kt)
          if [ "$ACTUAL_VERSION" != "$SELECTED_VERSION" ]; then
            echo "Selected version does not match source version: $ACTUAL_VERSION"
            exit 1
          fi
          echo "Verified source version: $ACTUAL_VERSION"

      - name: Set BUILD_VARIANT
        run: |
          BUILD_VARIANT="${{ github.event.inputs.buildVariant }}"
          echo "BUILD_VARIANT=$BUILD_VARIANT" >> $GITHUB_ENV
          VARIANT_FLAVOR=$(echo "$BUILD_VARIANT" | sed -E 's/(Release|Debug)$//' | tr '[:upper:]' '[:lower:]')
          VARIANT_TYPE=$(echo "$BUILD_VARIANT" | grep -oE '(Release|Debug)$' | tr '[:upper:]' '[:lower:]')
          echo "VARIANT_FLAVOR=$VARIANT_FLAVOR" >> $GITHUB_ENV
          echo "VARIANT_TYPE=$VARIANT_TYPE" >> $GITHUB_ENV
          VERSION_SUFFIX=""
          if [[ "$VARIANT_FLAVOR" != "full" ]]; then VERSION_SUFFIX="$VARIANT_FLAVOR"; fi
          if [[ "$VARIANT_TYPE" == "debug" ]]; then VERSION_SUFFIX="$VERSION_SUFFIX-debug"; fi
          if [[ -n "$VERSION_SUFFIX" && "$VERSION_SUFFIX" != -* ]]; then VERSION_SUFFIX="-$VERSION_SUFFIX"; fi
          echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> $GITHUB_ENV

      - name: Extract VERSION
        run: |
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          if echo "$BRANCH_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            VERSION="$BRANCH_NAME"
          else
            VERSION=$(grep 'val appVersion' buildSrc/src/main/kotlin/Versions.kt | awk -F '"' '{print $2}')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
              ./gradlew :app:assemble${{ env.BUILD_VARIANT }} :wear:assemble${{ env.BUILD_VARIANT }} \
              -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseParallelGC -Xss4m" \
              -Dkotlin.daemon.jvm.options="-Xmx1g" \
              -Pkotlin.compiler.execution.strategy="in-process" \
              -Dorg.gradle.daemon=true \
              -Dorg.gradle.workers.max=2 \
              -Dorg.gradle.caching=true \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/keystore/keystore.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Rename APKs with version
        run: |
          mv app/build/outputs/apk/${{ env.VARIANT_FLAVOR }}/${{ env.VARIANT_TYPE }}/*.apk aaps-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}.apk
          mv wear/build/outputs/apk/${{ env.VARIANT_FLAVOR }}/${{ env.VARIANT_TYPE }}/*.apk aaps-wear-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}.apk

      - name: Publish APKs to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT=$(git rev-parse HEAD)
          if [ -z "${RELEASE_TAG:-}" ]; then
            RELEASE_TAG="manual-${GITHUB_RUN_ID}"
            RELEASE_TITLE="AAPS ${VERSION}${VERSION_SUFFIX} (manual build)"
            PRERELEASE=true
          fi
          printf 'Source ref: %s
          Source commit: %s
          Build workflow: https://github.com/%s/actions/runs/%s
          '   "${SOURCE_REF:-manual}" "$SOURCE_COMMIT" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            DRAFT=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$DRAFT" != "true" ]; then
              echo "Release already published: $RELEASE_TAG"
              exit 0
            fi
          else
            FLAGS=(--draft --latest=false)
            if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"     --target "$CONTROLLER_SHA" --title "$RELEASE_TITLE"     --notes-file "$RUNNER_TEMP/release-notes.md" "${FLAGS[@]}"
          fi
          gh release upload "$RELEASE_TAG" ./*.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false

  # Configuration: Threshold-based cleanup
  # Clean up only occurs when total runs exceed: keep_runs + keep_threshold (e.g., 20 + 5 = 25)
  cleanup:
    name: Cleanup Old Workflow Runs
    needs: build
    if: always()
    permissions:
      actions: write
    uses: ./.github/workflows/cleanup-workflow-runs.yml
    with:
      workflow_name: 'AAPS CI'
      keep_runs: 20
      keep_threshold: 5
