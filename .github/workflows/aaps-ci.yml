name: AAPS CI
permissions:
  contents: read
jobs:
  build:
    name: Build AAPS
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
      with:
        path: controller
        persist-credentials: false
    - name: Preserve trusted JVM map
      run: |
        cp controller/.github/jdk-map.json "$RUNNER_TEMP/jdk-map.json"
    - name: Checkout source code at tag
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Fetch selected version from upstream
      env:
        SELECTED_VERSION: ${{ inputs.tagName }}
      run: |
        git remote add upstream https://github.com/nightscout/AndroidAPS.git
        if [ "$SELECTED_VERSION" = "4.0.0-dev-c" ]; then
          # Pin the requested dev-c snapshot rather than following a moving branch.
          SOURCE_REF="6deea754463b8df40251a765c4d12a289200cde3"
        else
          SOURCE_REF="refs/tags/$SELECTED_VERSION"
        fi
        git fetch upstream "$SOURCE_REF"
        SOURCE_COMMIT=$(git rev-parse 'FETCH_HEAD^{commit}')
        echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
        echo "Selected $SELECTED_VERSION at upstream commit $SOURCE_COMMIT"
    - name: Determine JVM version from tag
      run: |
        # jdk-map.json must be read before switching to the upstream tag,
        # as the upstream tag does not contain this file.
        TAG="${INPUT_TAGNAME}"
        JAVA_VERSION=$(jq -r '.default' "$RUNNER_TEMP/jdk-map.json")
        while IFS=$'\t' read -r pattern jdk; do
          if [[ "$TAG" == $pattern ]]; then
            JAVA_VERSION="$jdk"
            break
          fi
        done < <(jq -r '.mappings[] | "\(.pattern)\t\(.jdk)"' "$RUNNER_TEMP/jdk-map.json")
        echo "JAVA_VERSION=$JAVA_VERSION" >> $GITHUB_ENV
        echo "ℹ️ Tag $TAG → JDK $JAVA_VERSION (from jdk-map.json)"
      env:
        INPUT_TAGNAME: ${{ inputs.tagName }}
    - name: Switch to selected version
      env:
        SELECTED_VERSION: ${{ inputs.tagName }}
      run: |
        git checkout --detach "$SOURCE_COMMIT"
        ACTUAL_VERSION=$(sed -n 's/.*const val appVersion = "\([^"]*\)".*/\1/p' buildSrc/src/main/kotlin/Versions.kt)
        if [ "$ACTUAL_VERSION" != "$SELECTED_VERSION" ]; then
          echo "Selected version does not match source version: $ACTUAL_VERSION"
          exit 1
        fi
        echo "Verified source version: $ACTUAL_VERSION"
    - name: Set BUILD_VARIANT
      run: |
        BUILD_VARIANT="${INPUT_BUILDVARIANT}"
        echo "BUILD_VARIANT=$BUILD_VARIANT" >> $GITHUB_ENV
        VARIANT_FLAVOR=$(echo "$BUILD_VARIANT" | sed -E 's/(Release|Debug)$//' | tr '[:upper:]' '[:lower:]')
        VARIANT_TYPE=$(echo "$BUILD_VARIANT" | grep -oE '(Release|Debug)$' | tr '[:upper:]' '[:lower:]')
        echo "VARIANT_FLAVOR=$VARIANT_FLAVOR" >> $GITHUB_ENV
        echo "VARIANT_TYPE=$VARIANT_TYPE" >> $GITHUB_ENV
        VERSION_SUFFIX=""
        if [[ "$VARIANT_FLAVOR" != "full" ]]; then VERSION_SUFFIX="$VARIANT_FLAVOR"; fi
        if [[ "$VARIANT_TYPE" == "debug" ]]; then VERSION_SUFFIX="$VERSION_SUFFIX-debug"; fi
        if [[ -n "$VERSION_SUFFIX" && "$VERSION_SUFFIX" != -* ]]; then VERSION_SUFFIX="-$VERSION_SUFFIX"; fi
        echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> $GITHUB_ENV
      env:
        INPUT_BUILDVARIANT: ${{ inputs.buildVariant }}
    - name: Extract VERSION
      run: |
        BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
        if echo "$BRANCH_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
          VERSION="$BRANCH_NAME"
        else
          VERSION=$(grep 'val appVersion' buildSrc/src/main/kotlin/Versions.kt | awk -F '"' '{print $2}')
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: temurin
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build APKs
      run: |
        ./gradlew :app:assemble${{ env.BUILD_VARIANT }} :wear:assemble${{ env.BUILD_VARIANT }} \
        -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseParallelGC -Xss4m" \
        -Dkotlin.daemon.jvm.options="-Xmx1g" \
        -Pkotlin.compiler.execution.strategy="in-process" \
        -Dorg.gradle.daemon=true \
        -Dorg.gradle.workers.max=2 \
        -Dorg.gradle.caching=true
    - name: Record built source commit
      id: source
      run: |
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Collect phone and Wear APK data
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/apk-data"
        for module in app wear; do
          APK_FILES=("$module/build/outputs/apk/${VARIANT_FLAVOR}/${VARIANT_TYPE}/"*.apk)
          test "${#APK_FILES[@]}" -eq 1 && test -f "${APK_FILES[0]}"
          NAME=phone
          if [ "$module" = wear ]; then NAME=wear; fi
          cp -- "${APK_FILES[0]}" "$RUNNER_TEMP/apk-data/${NAME}.apk"
        done
    - name: Transfer APK data to isolated signing runner
      uses: actions/upload-artifact@v4
      with:
        name: apk-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/apk-data/*.apk
        if-no-files-found: error
        retention-days: 2
    permissions:
      contents: read
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
  cleanup:
    name: Cleanup Old Workflow Runs
    needs:
    - build
    - publish
    if: always()
    permissions:
      actions: write
    uses: ./.github/workflows/cleanup-workflow-runs.yml
    with:
      workflow_name: AAPS CI
      keep_runs: 20
      keep_threshold: 5
  publish:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/sign-publish-apks.yml
    secrets: inherit
    with:
      artifact_name: apk-${{ github.run_id }}-${{ github.run_attempt }}
      release_tag: manual-${{ github.run_id }}
      release_title: AAPS ${{ inputs.buildVariant }} / ${{ github.workflow }}
      source_ref: ${{ github.workflow }}
      source_sha: ${{ needs.build.outputs.source_sha }}
      prerelease: true
'on':
  workflow_dispatch:
    inputs:
      tagName:
        description: Select AAPS Version (dev-c is a pinned development snapshot)
        required: true
        default: 3.4.2.6
        type: choice
        options:
        - 4.0.0-dev-c
        - 3.4.2.6
        - 3.4.2.4
        - 3.4.2.3
        - 3.4.2.2
        - 3.4.2.1
        - 3.4.2.0
        - 3.4.1.0
        - 3.4.0.0
        - 3.3.2.1
      buildVariant:
        description: Select Build Variant
        required: true
        default: fullRelease
        type: choice
        options:
        - fullRelease
        - fullDebug
        - aapsclientRelease
        - aapsclientDebug
        - aapsclient2Release
        - aapsclient2Debug
        - pumpcontrolRelease
        - pumpcontrolDebug
