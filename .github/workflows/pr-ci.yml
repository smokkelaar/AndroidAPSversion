name: Pull Request CI(Test)
permissions:
  contents: read
jobs:
  build:
    name: Build AAPS
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        path: controller
        persist-credentials: false
    - name: Preserve trusted JVM map
      run: |
        cp controller/.github/jdk-map.json "$RUNNER_TEMP/jdk-map.json"
    - name: Determine PR reference
      id: pr_ref
      run: |
        [[ "$INPUT_PR_REF_TYPE" = head || "$INPUT_PR_REF_TYPE" = merge ]]
        [[ "$INPUT_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
        PR_NUMBER=${INPUT_PR_NUMBER}
        PR_REF_TYPE=${INPUT_PR_REF_TYPE}

        full_ref="refs/pull/${INPUT_PR_NUMBER}/$PR_REF_TYPE"

        echo "Resolved PR ref: $full_ref"
        echo "ref_name=$full_ref" >> $GITHUB_OUTPUT

        echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
        echo "PR_REF_TYPE=$PR_REF_TYPE" >> $GITHUB_ENV
      env:
        INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        INPUT_PR_REF_TYPE: ${{ inputs.pr_ref_type }}
    - name: Checkout pull/${{ github.event.inputs.pr_number }}/${{ github.event.inputs.pr_ref_type
        }}
      uses: actions/checkout@v5
      with:
        repository: ${{ github.event.inputs.repo }}
        ref: ${{ steps.pr_ref.outputs.ref_name }}
        fetch-depth: 1
        persist-credentials: false
    - name: Load jdk versions
      run: |
        JAVA_VERSION=$(jq -r '.default' "$RUNNER_TEMP/jdk-map.json")
        echo "JAVA_VERSION=$JAVA_VERSION" >> $GITHUB_ENV
    - name: Set BUILD_VARIANT
      run: |
        BUILD_VARIANT="${INPUT_BUILDVARIANT}"
        echo "BUILD_VARIANT=$BUILD_VARIANT" >> $GITHUB_ENV
        VARIANT_FLAVOR=$(echo "$BUILD_VARIANT" | sed -E 's/(Release|Debug)$//' | tr '[:upper:]' '[:lower:]')
        VARIANT_TYPE=$(echo "$BUILD_VARIANT" | grep -oE '(Release|Debug)$' | tr '[:upper:]' '[:lower:]')
        echo "VARIANT_FLAVOR=$VARIANT_FLAVOR" >> $GITHUB_ENV
        echo "VARIANT_TYPE=$VARIANT_TYPE" >> $GITHUB_ENV
        VERSION_SUFFIX=""
        if [[ "$VARIANT_FLAVOR" != "full" ]]; then VERSION_SUFFIX="$VARIANT_FLAVOR"; fi
        if [[ "$VARIANT_TYPE" == "debug" ]]; then VERSION_SUFFIX="$VERSION_SUFFIX-debug"; fi
        if [[ -n "$VERSION_SUFFIX" && "$VERSION_SUFFIX" != -* ]]; then VERSION_SUFFIX="-$VERSION_SUFFIX"; fi
        echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> $GITHUB_ENV
      env:
        INPUT_BUILDVARIANT: ${{ inputs.buildVariant }}
    - name: Extract VERSION
      run: |
        BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
        if echo "$BRANCH_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
          VERSION="$BRANCH_NAME"
        else
          VERSION=$(grep 'val appVersion' buildSrc/src/main/kotlin/Versions.kt | awk -F '"' '{print $2}')
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: temurin
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build APKs
      run: |
        ./gradlew :app:assemble${{ env.BUILD_VARIANT }} :wear:assemble${{ env.BUILD_VARIANT }} \
          -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseParallelGC -Xss4m" \
          -Dkotlin.daemon.jvm.options="-Xmx2g" \
          -Dkotlin.compiler.execution.strategy="in-process" \
          -Dorg.gradle.daemon=true \
          -Dorg.gradle.workers.max=2 \
          -Dorg.gradle.caching=true
    - name: Record built source commit
      id: source
      run: |
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Collect phone and Wear APK data
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/apk-data"
        for module in app wear; do
          APK_FILES=("$module/build/outputs/apk/${VARIANT_FLAVOR}/${VARIANT_TYPE}/"*.apk)
          test "${#APK_FILES[@]}" -eq 1 && test -f "${APK_FILES[0]}"
          NAME=phone
          if [ "$module" = wear ]; then NAME=wear; fi
          cp -- "${APK_FILES[0]}" "$RUNNER_TEMP/apk-data/${NAME}.apk"
        done
    - name: Transfer APK data to isolated signing runner
      uses: actions/upload-artifact@v4
      with:
        name: apk-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/apk-data/*.apk
        if-no-files-found: error
        retention-days: 2
    permissions:
      contents: read
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
  publish:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/sign-publish-apks.yml
    secrets: inherit
    with:
      artifact_name: apk-${{ github.run_id }}-${{ github.run_attempt }}
      release_tag: manual-${{ github.run_id }}
      release_title: AAPS ${{ inputs.buildVariant }} / ${{ github.workflow }}
      source_ref: ${{ github.workflow }}
      source_sha: ${{ needs.build.outputs.source_sha }}
      prerelease: true
'on':
  workflow_dispatch:
    inputs:
      repo:
        description: 'Target repository (format: owner/repo)'
        required: true
        default: nightscout/AndroidAPS
      pr_number:
        description: PR number to checkout (e.g. 123)
        required: true
      pr_ref_type:
        description: Select PR reference type to checkout
        required: true
        default: head
        type: choice
        options:
        - head
        - merge
      buildVariant:
        description: Select Build Variant
        required: true
        default: fullRelease
        type: choice
        options:
        - fullRelease
        - fullDebug
        - aapsclientRelease
        - aapsclientDebug
        - aapsclient2Release
        - aapsclient2Debug
        - pumpcontrolRelease
        - pumpcontrolDebug
