// The controller verified three AAR checksums and the archived Wear POM checksum.
allprojects {
    def verifiedRepository = repositories.maven {
            url uri(System.getenv('LEGACY_MAVEN'))
            content {
                includeModule 'com.google.android', 'flexbox'
                includeModule 'com.amulyakhare', 'com.amulyakhare.textdrawable'
                includeModule 'me.denley.wearpreferenceactivity', 'wearpreferenceactivity'
            }
    }
    // Gradle 5.6 supports content filters; exclusiveContent requires newer Gradle.
    // Apply to repositories already present and those added by the source build.
    repositories.all { repository ->
        if (repository != verifiedRepository) {
            repository.content {
                excludeModule 'com.google.android', 'flexbox'
                excludeModule 'com.amulyakhare', 'com.amulyakhare.textdrawable'
                excludeModule 'me.denley.wearpreferenceactivity', 'wearpreferenceactivity'
            }
        }
    }
    // Replace Fabric's generated build identifier, while retaining its runtime SDK.
    plugins.withId('com.android.application') {
        if (project.path == ':app' && System.getenv('VERSION') == '2.6.2') {
            android.defaultConfig.resValue 'string', 'com.crashlytics.android.build_id',
                '408329db-4c83-3c47-bafe-4c7971fdbc1d'
        }
    }
}
